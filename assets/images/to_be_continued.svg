<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">To be continued</title>
  <desc id="desc">A temporary story card with centered To be continued text.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#243047"/>
      <stop offset="58%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#8f6910"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8f6910"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="58" y="58" width="1484" height="784" rx="18" fill="none" stroke="#d4af37" stroke-opacity="0.32" stroke-width="4"/>
  <rect x="88" y="88" width="1424" height="724" rx="12" fill="none" stroke="#d4af37" stroke-opacity="0.13" stroke-width="2"/>
  <path d="M370 450H145M1230 450h225" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <circle cx="320" cy="450" r="7" fill="#d4af37" opacity="0.75"/>
  <circle cx="1280" cy="450" r="7" fill="#d4af37" opacity="0.75"/>
  <text x="800" y="424" text-anchor="middle" fill="#f5f5dc" font-family="Cinzel, Georgia, serif" font-size="86" letter-spacing="5" filter="url(#softGlow)">To be continued</text>
  <text x="800" y="512" text-anchor="middle" fill="#d4af37" font-family="Cinzel, Georgia, serif" font-size="72" letter-spacing="10" opacity="0.9">...</text>
</svg>
